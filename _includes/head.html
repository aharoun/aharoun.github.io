<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <script src="https://kit.fontawesome.com/4fb5cb0243.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@v1.9.1/css/academicons.min.css" />
  <link rel="preload" href="/assets/fonts/tex-gyre-pagella-regular.otf" as="font" type="font/otf" crossorigin />
  <link rel="preload" href="/assets/fonts/fira-sans-regular.otf" as="font" type="font/otf" crossorigin />
  <link rel="stylesheet" href="/assets/style.css" />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  {% if page.layout == "home" %}
  <title>{{ site.title }}</title>
  {% else %}
  <title>{{ site.title }} - {{ page.title }}</title>
  {% endif %}

  {% if site.analytics %}
  {% include analytics.html %}
  {% endif %}

  {% seo title=false %}
</head>
