<script>
  // Google Analytics. Skipped on local previews and in any browser that has
  // visited the site once with ?notrack (undo with ?track).
  (function () {
    var off = false;
    try {
      if (/[?&]notrack\b/.test(location.search)) {
        localStorage.setItem("notrack", "1");
        alert("Visits from this browser will no longer be counted.");
      }
      if (/[?&]track\b/.test(location.search)) localStorage.removeItem("notrack");
      off = localStorage.getItem("notrack") === "1";
    } catch (e) {}
    if (off || !/(^|\.)harunalp\.net$/.test(location.hostname)) return;
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtag/js?id={{ site.analytics }}";
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag("js", new Date());
    gtag("config", "{{ site.analytics }}");
  })();
</script>
